name: Dependabot Changeset

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-changeset:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.title, 'deps(npm)')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: get-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate changeset
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const script = require('./packages/tools/pie-monorepo-utils/generate-dependabot-changeset/generate-dependabot-changeset.js');
            await script({ github, context });
